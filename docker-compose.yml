version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  pokemon-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    environment:
      POD_IP: "127.0.0.1"
      REDIS_URL: "redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    links:
      - redis
    volumes:
      - ./src:/app/src:ro

volumes:
  redis_data:
